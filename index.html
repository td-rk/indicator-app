
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Switch</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      font-family: sans-serif;
      display: grid;
      place-items: center;
      background: #E4EAF5;
      color: #243B65;
      transition: background 0.2s, color 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body.rest {
      background: #E8F0E7;
      color: #31583C;
    }

    main {
      width: 100%;
      height: 100%;
      display: grid;
      place-content: center;
      text-align: center;
      cursor: pointer;
    }

    h1 {
      font-size: 3rem;
      font-weight: 500;
    }

    p {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <main id="switch">
    <h1 id="status">勉強</h1>
    <p>TAP TO SWITCH</p>
  </main>

  <script>
    const body = document.body;
    const status = document.getElementById("status");
    const button = document.getElementById("switch");

    let isRest = false;

    button.addEventListener("click", () => {
      isRest = !isRest;

      status.textContent = isRest ? "休憩" : "勉強";
      body.classList.toggle("rest", isRest);
    });
  </script>
</body>
</html>
